<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Empanadas Soffin</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <header>
        <h1>🔐 Iniciar Sesión</h1>
        <p>Panel de Administración — Empanadas Soffin</p>
    </header>

    <section class="caja-formulario">
        <h2>Inicia sesión con tu cuenta</h2>
        <form action="#" method="POST" id="formLogin">
            <div class="grupo-formulario">
                <label>Usuario o Correo</label>
                <input type="text" id="usuario" placeholder="Escribe tu usuario" required>
            </div>
            <div class="grupo-formulario">
                <label>Contraseña</label>
                <input type="password" id="contraseña" placeholder="Escribe tu contraseña" required>
            </div>
            <button type="submit" class="boton">Entrar</button>
        </form>
        <div style="text-align: center; margin-top: 15px;">
            <a href="recuperar.html" class="enlace-pequeño">¿Olvidaste tu contraseña?</a>
        </div>
        <div style="text-align: center; margin-top: 10px;">
            <a href="registro.html" class="enlace-pequeño">¿No tienes cuenta? Crear cuenta</a>
        </div>
        <div style="text-align: center; margin-top: 10px;">
            <a href="../index.html" class="enlace-pequeño">← Volver a la Tienda</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Empanadas Soffin | El mejor sabor casero</p>
    </footer>

    <script src="js/validaciones.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById("formLogin").addEventListener("submit", function(e) {
            e.preventDefault();
            if (!validarCamposVacios(this)) return;
            alert("✅ ¡Bienvenido! Redirigiendo al panel...");
            window.location.href = "dashboard_usuario.html";
        });
    </script>
</body>
</html>
